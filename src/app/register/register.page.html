<ion-content [fullscreen]="true">
  <div class="relative min-h-full flex flex-col items-center justify-center px-6 py-10 overflow-hidden">

    <div class="pointer-events-none absolute left-1/2 top-[18%] -translate-x-1/2 w-[420px] h-[420px] rounded-full"
         style="background: radial-gradient(circle, rgba(255,126,95,.22) 0%, rgba(255,160,122,.08) 45%, rgba(8,8,10,0) 70%)"></div>

    <div class="relative w-full max-w-sm flex flex-col items-center">
      <h1 class="font-sans font-extralight text-4xl tracking-tight text-white/90">Join MELL</h1>
      <p class="mt-3 text-center font-sans text-[11px] font-medium uppercase tracking-[0.16em] text-white/50">
        Un espacio para ti, a tu ritmo
      </p>

      <form class="mt-12 w-full flex flex-col gap-4" (ngSubmit)="join()">
        <input name="firstName" type="text" autocomplete="given-name"
               [(ngModel)]="firstName" placeholder="TU NOMBRE"
               class="w-full rounded-full bg-obsidian/70 border border-hairline px-6 py-4 text-sm font-light tracking-widest text-white/90 placeholder-white/30 outline-none focus:border-peach/50 focus:shadow-halo transition" />

        <input name="email" type="email" autocomplete="email"
               [(ngModel)]="email" placeholder="CORREO"
               class="w-full rounded-full bg-obsidian/70 border border-hairline px-6 py-4 text-sm font-light tracking-widest text-white/90 placeholder-white/30 outline-none focus:border-peach/50 focus:shadow-halo transition" />

        <input name="password" type="password" autocomplete="new-password"
               [(ngModel)]="password" placeholder="CONTRASEÑA (MÍN. 8)"
               class="w-full rounded-full bg-obsidian/70 border border-hairline px-6 py-4 text-sm font-light tracking-widest text-white/90 placeholder-white/30 outline-none focus:border-peach/50 focus:shadow-halo transition" />

        @if (error()) {
        <p class="text-center text-xs font-light tracking-wide text-blush">{{ error() }}</p>
        }

        <button type="submit" [disabled]="loading()"
                class="mt-2 w-full rounded-full bg-white/90 py-4 font-sans text-[13px] font-medium uppercase tracking-[0.12em] text-void disabled:opacity-50 transition">
          {{ loading() ? 'Creando…' : 'Join' }}
        </button>
      </form>

      <p class="mt-10 text-[11px] font-medium uppercase tracking-[0.16em] text-white/50">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="ml-1 text-peach">Enter</a>
      </p>
    </div>
  </div>
</ion-content>
